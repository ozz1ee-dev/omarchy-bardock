name: checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: model tests
        run: node --test test/

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifest contract
        run: python3 scripts/check-manifest.py .

  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: text files are ASCII
        run: |
          set -euo pipefail
          files=$(git ls-files '*.md' '*.js' '*.qml' '*.json' '*.sh' '*.py' '*.yml')
          if LC_ALL=C grep -nP '[^\x00-\x7F]' $files; then
            echo "non-ASCII characters found in the lines above"
            exit 1
          fi
          echo "all tracked text files are ASCII"
