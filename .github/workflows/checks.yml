name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: model and compat tests
        run: node --test test/*.test.js

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: manifest contract
        run: python3 scripts/check-manifest.py .

  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: text files are ASCII
        run: |
          set -euo pipefail
          files=$(git ls-files '*.md' '*.js' '*.qml' '*.json' '*.sh' '*.py' '*.yml')
          if LC_ALL=C grep -nP '[^\x00-\x7F]' $files; then
            echo "non-ASCII characters found in the lines above"
            exit 1
          fi
          echo "all tracked text files are ASCII"
